name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pixi-test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.67.0
          cache: true

      - name: Setup colcon mixins
        run: pixi run setup-colcon

      - name: Build ROS2 workspace
        run: pixi run -e humble build

      - name: Smoke test Pixi environment
        run: pixi run -e humble test-install
