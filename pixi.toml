[workspace]
authors = ["Charles Sirois <charles.sirois@mail.mcgill.ca>"]
channels = ["conda-forge"]
name = "adl-ros2"
platforms = ["linux-64", "osx-arm64", "osx-64"]  # macOS for the analysis environment only
version = "0.1.0"

[activation]
scripts = ["scripts/activate_overlay.sh"]

[activation.env]
CMAKE_INSTALL_MODE = "SYMLINK"
COLCON_DEFAULT_OUTPUT_STYLE = "catkin_tools"
ROS_DOMAIN_ID = "01"

# -----------------------------
# MARK: Tasks
# -----------------------------
[tasks]
setup-colcon = { cmd = """
colcon mixin add default https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml && \
colcon mixin update default
""" }

build = { cmd = [
    "colcon",
    "build",
    "--build-base",
    "build_$ROS_DISTRO",
    "--install-base",
    "install_$ROS_DISTRO",
    "--symlink-install",
    "--cmake-args",
    "'-DCMAKE_BUILD_TYPE=Debug'",
] }

test = { cmd = [
    "colcon",
    "test",
    "--python-testing",
    "pytest",
    "--build-base",
    "build_$ROS_DISTRO",
    "--install-base",
    "install_$ROS_DISTRO",
], depends-on = "build" }

test-py = { cmd = "pytest python/fr3_haptic/tests", depends-on = "build" } # Python-only packages in python/ (pyrim is tested in external/adl-python)

gen-vscode-env = { cmd = """
bash -c '
  mkdir -p .vscode &&
  source install_$ROS_DISTRO/setup.bash &&
  env | grep -E "^(AMENT|COLCON|ROS|PYTHONPATH|LD_LIBRARY_PATH|PATH|CMAKE)" > .vscode/.env.$ROS_DISTRO
'
""" } # Export env for debugger

test-install = { cmd = [
    "python",
    "scripts/test_install.py",
] } # Test installation

[environments]
default = { features = ["linux"] }  # the root dependencies (CUDA jax, pyroki) are Linux-only
humble = { features = ["humble", "dev"] }
# the talk figures and the run analysis (experiments/rim-delays/analysis), on any laptop: no ROS, no
# robot stack, no CUDA (pixi run -e analysis figures)
analysis = { features = ["analysis"], no-default-feature = true }

# -----------------------------
# MARK: General dependencies
# -----------------------------
[dependencies]
# ROS 2 Humble is built against Python 3.10.
python = ">=3.10,<3.13"
compilers = "*"
c-compiler = "*"
cxx-compiler = "*"
# Keep CMake below 3.27 to avoid ROS Humble/Python discovery policy issues.
cmake = ">=3.22,<3.27"
make = "*"
pkg-config = "*"
ninja = "*"
numpy = "<=2, <=2.4.3"
colcon-common-extensions = ">=0.3.0,<0.4"
colcon-mixin = ">=0.2.3,<0.3"
zensical = ">=0.0.32,<0.0.33"
orjson = ">=3.11.8,<4"
ipykernel = ">=7.2.0,<8"
pandas = ">=3.0.2,<4"
mcap = ">=1.3.1,<2"
pyserial = ">=3.5,<4"

[pypi-dependencies]
adl-ros2 = { path = ".", editable = true }
# adl-python (git submodule at external/adl-python)
pyrim = { path = "external/adl-python/packages/pyrim", editable = true }
haptic_teleop = { path = "external/adl-python/packages/haptic_teleop", editable = true }
experiment_logger = { path = "external/adl-python/packages/experiment_logger", editable = true }
utilities = { path = "external/adl-python/packages/utilities", editable = true }
fr3_haptic = { path = "python/fr3_haptic", editable = true }
colcon-ansi-colors = { git = "https://github.com/SimbeRobotics/colcon-ansi-colors" }
pyroki = { git = "https://github.com/chungmin99/pyroki.git" }
pyglet = ">=2.1.13, <3"
jax = { version = ">=0.9.2, <0.10", extras = ["cuda12"] }
foxglove-sdk = ">=0.22.0, <0.23"

[feature.linux]
platforms = ["linux-64"]

# -----------------------------
# MARK: Humble
# -----------------------------
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]
platforms = ["linux-64"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
ros-humble-franka-ros2 = "*"
ros-humble-ament-cmake = "<4.0"
ros-humble-control-toolbox = "*"
ros-humble-controller-interface = "*"
ros-humble-control-msgs = "*"
ros-humble-controller-manager = "*"
ros-humble-geometry-msgs = "*"
ros-humble-hardware-interface = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-sensor-msgs = "*"
ros-humble-joy = "*"
ros-humble-rqt-graph = "*"
ros-humble-rviz2 = "*"
ros-humble-foxglove-bridge = "*"
colcon-common-extensions = "*"
rosdep = "*"
libstdcxx-ng = "*"

[feature.humble.pypi-dependencies]
viser = ">=1.0.16, <2"
websockets = "*"

# -----------------------------
# MARK: Dev
# -----------------------------
[feature.dev.pypi-dependencies]
ruff = "*"
bumpver = "*"
build = "*"
twine = "*"
pre-commit = "*"
pytest = "*"
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.6.0"
mkdocstrings = { version = ">=0.30.0", extras = ["python"] }
mkdocs-gen-files = ">=0.5.0"
mkdocs-literate-nav = ">=0.6.0"
mkdocs-section-index = ">=0.3.0"
markdown-callouts = "*"

# -----------------------------
# MARK: Analysis
# -----------------------------
# The run loader (experiment_logger) and the guide (fr3_haptic) are found by path from the notebook,
# not installed: installing them pulls their ROS-side dependencies. The arm's model (Λ) comes from
# experiments/rim-delays/analysis/model_cache.json. LaTeX text if a TeX install is found, else mathtext.
[feature.analysis]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[feature.analysis.dependencies]
python = "3.12.*"
numpy = ">=2,<2.5"
pandas = ">=2.2"
scipy = "*"
matplotlib-base = "*"
mcap = ">=1.3.1,<2"
pyyaml = "*"
ipykernel = "*"
jupyterlab = "*"
nbconvert-core = "*"

[feature.analysis.tasks]
figures = { cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 talk_figures.ipynb", cwd = "experiments/rim-delays/analysis" }
pack-data = { cmd = "python experiments/rim-delays/tools/pack_analysis_data.py" }
