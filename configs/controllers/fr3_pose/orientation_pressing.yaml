motion.max_linear_velocity: 0.10  # Maximum linear velocity for trajectory generation (m/s) [0.0, 3.0]
motion.max_angular_velocity: 1.50  # Maximum angular velocity for trajectory generation (rad/s) [0.0, 2.5]

filter.target_pose: 1.00  # Smoothing for single-pose inputs using EMA (0.0: Max filtering, 1.0: No filtering)

log.enabled: true
log.robot_state: true  #  ee position, velocity, joint states, ...
log.targets: true  # target pose
log.timing: true
