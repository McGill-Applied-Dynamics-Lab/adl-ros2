[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrim"
version = "0.1.0"
description = "Reduced Interface Model computation and integration for haptic teleoperation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrim"]
